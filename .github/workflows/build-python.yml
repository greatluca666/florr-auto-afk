# Builds segment.exe (PyInstaller --onedir) and packs it as a plain zip.
#
# - Branch pushes (upgrade-*) and PRs: build + upload the zip as a workflow
#   artifact only, never a release.
# - Push to main: also create the GitHub release for constants.VERSION_INFO
#   if it does not exist yet. An existing release is never touched and the
#   asset is never overwritten (no --clobber): downstream pins the zip's
#   SHA-256, so a silent rebuild under the same tag would break every install.
name: Build Python
on:
  push:
    branches: [ "main", "upgrade-*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from constants.py
        id: get_version
        shell: python
        run: |
          import os, re
          with open('constants.py', 'r') as f:
              content = f.read()
          match = re.search(r'^VERSION_INFO\s*=\s*"([^"]+)"', content, re.M)
          if not match:
              raise ValueError("VERSION_INFO not found in constants.py")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"version={match.group(1)}\n")

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pywin32
          pip install -r py311-requirements.txt
          pip install pyinstaller

      - name: Run PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller segment.spec

      - name: Assemble and zip
        shell: powershell
        run: |
          Copy-Item -Path ./config.json -Destination ./dist/segment/config.json
          Copy-Item -Path ./extension.swap.json -Destination ./dist/segment/extension.swap.json
          Copy-Item -Path ./conversation.json -Destination ./dist/segment/conversation.json
          Copy-Item -Path ./README.md -Destination ./dist/segment/README.md
          Copy-Item -Path ./LICENSE -Destination ./dist/segment/LICENSE
          Copy-Item -Path ./extension.js -Destination ./dist/segment/extension.js
          New-Item -Path ./dist/segment/imgs -ItemType Directory
          Copy-Item -Path ./imgs/test.png -Destination ./dist/segment/imgs/test.png
          Copy-Item -Path ./models -Destination ./dist/segment/models -Recurse
          Copy-Item -Path ./extensions -Destination ./dist/segment/extensions -Recurse
          Copy-Item -Path ./gui -Destination ./dist/segment/gui -Recurse
          # Upstream makes _internal/extensions a directory symlink to ../extensions,
          # which a zip cannot carry; ship a real copy instead.
          if (Test-Path ./dist/segment/_internal/extensions) { Remove-Item -Recurse -Force ./dist/segment/_internal/extensions }
          Copy-Item -Path ./extensions -Destination ./dist/segment/_internal/extensions -Recurse
          # No top-level directory inside the zip: the consumer extracts it into
          # a directory of its own choosing.
          Compress-Archive -Path ./dist/segment/* -DestinationPath ./dist/florr-auto-afk-v${{ steps.get_version.outputs.version }}-auto.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: florr-auto-afk-v${{ steps.get_version.outputs.version }}-auto
          path: ./dist/florr-auto-afk-v${{ steps.get_version.outputs.version }}-auto.zip
          compression-level: 0
          retention-days: 14

      - name: Create release (main only, never overwrite)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.get_version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving it untouched."
          else
            gh release create "$tag" \
              "./dist/florr-auto-afk-v${{ steps.get_version.outputs.version }}-auto.zip" \
              --title "Release $tag" \
              --notes "Automated release for version $tag" \
              --target main
          fi
